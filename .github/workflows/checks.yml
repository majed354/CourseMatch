name: CourseMatch checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r equivalency-pilot/requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests
      - run: npm test
      - run: npm run verify
      - run: npm run build
      - run: node -e "import('./netlify/functions/coursematch.mjs')"
